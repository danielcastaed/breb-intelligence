name: Actualizar datos de BanRep

on:
  schedule:
    - cron: "0 12 * * 1"   # cada lunes, 7:00 a. m. en Colombia (trae el último corte de BanRep y cierra el mes anterior si falta)
  push:                    # un cambio al workflow o a los scripts también corre la actualización, sin lanzarla a mano
    branches: [main]
    paths:
      - ".github/workflows/update-data.yml"
      - "scripts/fetch_banrep.py"
      - "scripts/fetch_sfc_tarjetas.py"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Revisar todos los cierres de mes desde el lanzamiento"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Leer los reportes públicos de BanRep
        env:
          BREB_MOL_URL: ${{ secrets.BREB_MOL_URL }}
          BREB_DICE_URL: ${{ secrets.BREB_DICE_URL }}
        run: python scripts/fetch_banrep.py ${{ inputs.backfill && '--backfill' || '' }}
      - name: Compras con tarjeta (SFC, datos abiertos)
        if: always()
        run: python scripts/fetch_sfc_tarjetas.py
      - name: Publicar cambios
        if: always()
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "data: actualiza cortes de BanRep ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash
            git push
          else
            echo "Sin cambios en los datos."
          fi
      - name: Guardar evidencia si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-banrep
          path: debug/
          if-no-files-found: ignore
